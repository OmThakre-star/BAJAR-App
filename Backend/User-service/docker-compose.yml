version: '3.8'
services:
  user-service:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config/userConfig.yaml:/app/config/userConfig.yaml
    depends_on:
      - postgres
    environment:
      - CONFIG_PATH=./config/userConfig.yaml
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
